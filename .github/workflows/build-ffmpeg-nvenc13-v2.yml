name: Build FFmpeg NVENC API 13.0

on:
  workflow_dispatch: {}
  push:
    branches:
      - feature/gpu-overlay-pass

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout GPU branch
        uses: actions/checkout@v4

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            nasm
            yasm
            diffutils
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build FFmpeg with pinned nv-codec-headers 13.0
        run: |
          set -euxo pipefail
          mkdir -p /c/ffmpeg-build/deps
          cd /c/ffmpeg-build/deps
          git clone --depth 1 --branch n13.0.19.1 https://github.com/FFmpeg/nv-codec-headers.git nv-codec-headers-13.0
          cd nv-codec-headers-13.0
          grep -E 'NVENCAPI_MAJOR_VERSION|NVENCAPI_MINOR_VERSION' include/ffnvcodec/nvEncodeAPI.h
          make
          make install PREFIX=/ucrt64

          cd /c/ffmpeg-build/deps
          git clone --depth 1 --branch n8.0.1 https://git.ffmpeg.org/ffmpeg.git ffmpeg-source
          cd ffmpeg-source
          ./configure \
            --prefix=/c/ffmpeg-build/out \
            --target-os=mingw32 \
            --arch=x86_64 \
            --enable-cross-compile \
            --cross-prefix=x86_64-w64-mingw32- \
            --cc=x86_64-w64-mingw32-gcc \
            --pkg-config=pkg-config \
            --enable-gpl \
            --enable-version3 \
            --enable-nvenc \
            --enable-encoder=h264_nvenc \
            --enable-encoder=hevc_nvenc \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-demuxer=mov \
            --enable-muxer=mp4 \
            --enable-filter=scale \
            --enable-filter=overlay \
            --enable-filter=drawbox \
            --enable-filter=ass \
            --enable-protocol=file \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-shared \
            --enable-static \
            --extra-cflags='-I/ucrt64/include' \
            --extra-ldflags='-L/ucrt64/lib'
          make -j$(nproc)
          make install

          mkdir -p /c/ffmpeg-build/package/bin
          cp /c/ffmpeg-build/out/bin/ffmpeg.exe /c/ffmpeg-build/package/bin/
          cp /c/ffmpeg-build/out/bin/ffprobe.exe /c/ffmpeg-build/package/bin/
          "$PWD/ffmpeg" -hide_banner -version > /c/ffmpeg-build/package/ffmpeg-version.txt
          "$PWD/ffmpeg" -hide_banner -encoders | grep -E 'h264_nvenc|hevc_nvenc' > /c/ffmpeg-build/package/nvenc-encoders.txt
          cat > /c/ffmpeg-build/package/README.txt <<'EOF'
          FFmpeg NVENC API 13.0 test build

          Built with:
          - nv-codec-headers n13.0.19.1
          - FFmpeg n8.0.1
          - Windows UCRT64 x86_64 static build

          Before using it in Recap, run this on the target Windows PC:
          ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=1280x720:rate=30 -t 5 -c:v h264_nvenc -f null -

          The test must complete without an NVENC API-version mismatch. Keep the existing CPU FFmpeg as a backup.
          EOF
          cd /c/ffmpeg-build/package
          7z a /c/ffmpeg-build/ffmpeg-nvenc-api13.0-win64.zip bin ffmpeg-version.txt nvenc-encoders.txt README.txt

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-nvenc-api13.0-win64
          path: C:/ffmpeg-build/ffmpeg-nvenc-api13.0-win64.zip
          if-no-files-found: error
          retention-days: 30
